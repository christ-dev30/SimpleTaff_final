<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Admin Entreprise — SimpleTaff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        window.fallbackAvatar = function(img) {
            if (!img || img.dataset.fallbackDone) return;
            img.dataset.fallbackDone = 'true';
            const initial = img.getAttribute('data-initial') || 'A';
            const parent = img.parentElement;
            if (parent) {
                parent.innerHTML = `<span class="inline-flex w-8 h-8 rounded-full bg-slate-200 items-center justify-center text-slate-500 font-bold text-xs">${initial}</span>`;
            } else {
                img.src = '/shared/default-avatar.png';
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared/global.css">
    <script>
        // Disable Tailwind preflight to avoid CSS conflicts on layout elements
        tailwind.config = { corePlugins: { preflight: false } };
    </script>
    <style>
        /* ═══════════════════════════════════════════════════════════════════
           RESET & BASE
        ═══════════════════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; }
        h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; margin: 0; }

        /* ═══════════════════════════════════════════════════════════════════
           DESIGN TOKENS
        ═══════════════════════════════════════════════════════════════════ */
        .glass {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 24px -4px rgba(0,0,0,0.06);
        }
        .badge {
            display: inline-flex; align-items: center;
            padding: 2px 10px; border-radius: 999px;
            font-size: 11px; font-weight: 700; line-height: 1.5;
        }
        .input-field {
            display: block; width: 100%;
            padding: 10px 14px; border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: rgba(255,255,255,0.85);
            font-size: 14px; font-family: inherit;
            color: #1e293b; outline: none;
            transition: border-color 150ms, box-shadow 150ms;
        }
        .input-field:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2,132,199,0.12);
            background: #fff;
        }
        .btn-brand {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 20px; border-radius: 12px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: #fff; font-weight: 700; font-size: 13px;
            font-family: inherit; border: none; cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s;
        }
        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(2,132,199,0.4);
        }

        /* ═══════════════════════════════════════════════════════════════════
           TAB SYSTEM
        ═══════════════════════════════════════════════════════════════════ */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ═══════════════════════════════════════════════════════════════════
           LAYOUT — DESKTOP FIRST (sidebar always visible ≥ 768px)
        ═══════════════════════════════════════════════════════════════════ */
        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ─────────────────────────────────────────────────────── */
        .main-sidebar {
            width: 264px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(226,232,240,0.8);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 10;
            /* smooth slide for mobile */
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        .sidebar-link {
            display: flex; align-items: center;
            padding: 10px 14px; border-radius: 12px;
            font-weight: 600; font-size: 13px; line-height: 1.4;
            color: #64748b; cursor: pointer;
            transition: background 150ms, color 150ms;
            user-select: none; gap: 8px;
        }
        .sidebar-link:hover { background: #f1f5f9; color: #1e293b; }
        .sidebar-link.active { background: #e0f2fe; color: #0284c7; }
        .sidebar-link svg { flex-shrink: 0; }

        /* ── Main area ───────────────────────────────────────────────────── */
        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* Desktop header */
        .desktop-header {
            height: 64px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226,232,240,0.6);
            z-index: 5;
        }

        /* Scrollable content area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            -webkit-overflow-scrolling: touch;
        }

        /* ── Mobile topbar (hidden on desktop) ───────────────────────────── */
        #mobile-topbar {
            display: none; /* hidden by default */
            position: fixed; top: 0; left: 0; right: 0;
            height: 56px; z-index: 600;
            padding: 0 16px;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #e2e8f0;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 16px -4px rgba(0,0,0,0.1);
        }

        .hamburger-btn {
            display: flex; flex-direction: column;
            gap: 5px; width: 40px; height: 40px;
            align-items: center; justify-content: center;
            border-radius: 10px; background: #f1f5f9;
            border: none; cursor: pointer; flex-shrink: 0;
        }
        .hamburger-btn span {
            display: block; width: 20px; height: 2px;
            background: #334155; border-radius: 2px;
            transition: all 0.25s ease;
        }
        .hamburger-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .hamburger-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* ── Sidebar overlay (mobile only) ──────────────────────────────── */
        #sidebar-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.5);
            backdrop-filter: blur(4px);
            z-index: 550;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #sidebar-overlay.open { display: block; opacity: 1; }

        /* ═══════════════════════════════════════════════════════════════════
           RESPONSIVE — MOBILE (< 768px)
        ═══════════════════════════════════════════════════════════════════ */
        @media (max-width: 767px) {
            /* Collapse the flex layout — use normal block flow */
            .app-layout {
                display: block;
                height: auto;
                overflow: visible;
                min-height: 100vh;
            }

            /* Show mobile topbar */
            #mobile-topbar { display: flex; }

            /* Sidebar: drawer off-screen */
            .main-sidebar {
                position: fixed !important;
                top: 0; left: 0; bottom: 0;
                width: 280px !important;
                height: 100% !important;
                z-index: 700;
                transform: translateX(-100%);
                box-shadow: none;
            }
            .main-sidebar.open {
                transform: translateX(0);
                box-shadow: 8px 0 48px -8px rgba(0,0,0,0.28);
            }

            /* Main: block, pad below topbar */
            .app-main {
                display: block;
                padding-top: 56px;
                overflow: visible;
                height: auto;
                min-height: calc(100vh - 56px);
            }

            /* Hide desktop header */
            .desktop-header { display: none; }

            /* Content */
            .content-area {
                padding: 16px;
                overflow: visible;
                height: auto;
            }

            /* iOS input zoom prevention */
            .input-field { font-size: 16px !important; }

            /* Tables always scroll */
            table { min-width: 600px; }
            .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
        }

        /* ═══════════════════════════════════════════════════════════════════
           RESPONSIVE — TABLET (768–1023px)
        ═══════════════════════════════════════════════════════════════════ */
        @media (min-width: 768px) and (max-width: 1023px) {
            #mobile-topbar { display: none !important; }
            .main-sidebar { width: 220px; }
            .content-area { padding: 24px; }
        }

        /* ═══════════════════════════════════════════════════════════════════
           RESPONSIVE — DESKTOP (≥ 1024px)
        ═══════════════════════════════════════════════════════════════════ */
        @media (min-width: 1024px) {
            #mobile-topbar { display: none !important; }
            .main-sidebar { width: 264px; }
            .content-area { padding: 32px; }
        }

        /* ═══════════════════════════════════════════════════════════════════
           MISC UI POLISH
        ═══════════════════════════════════════════════════════════════════ */
        /* Hide scrollbars entirely while keeping scroll functionality */
        * { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; }

        /* Remove ugly black borders from Tailwind default button styles */
        button { border: none; outline: none; }
        button:focus { outline: none; box-shadow: none; }
        input, select, textarea { outline: none; }
        select { appearance: auto; }

        /* Prevent tap highlight on mobile */
        button, a, [onclick] { -webkit-tap-highlight-color: transparent; }
    </style>
    <!-- ── Critical global functions (must be available before DOMContentLoaded) ── -->
    <script>
        // showTab: onglet navigation
        window.showTab = function(name) {
            document.querySelectorAll('.tab-content').forEach(el => { el.classList.remove('active'); el.style.display = 'none'; });
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            const tab = document.getElementById('tab-' + name);
            if (tab) { tab.style.display = 'block'; tab.classList.add('active'); }
            // Mark correct sidebar link as active
            document.querySelectorAll('.sidebar-link').forEach(link => {
                if (link.getAttribute('onclick') && link.getAttribute('onclick').includes(`'${name}'`)) {
                    link.classList.add('active');
                }
            });
            // Close mobile sidebar after navigation
            closeMobileSidebar();
            // Trigger data load — check function exists before calling (module may not be ready yet)
            setTimeout(() => {
                if (name === 'overview'      && typeof window.loadOverview      === 'function') window.loadOverview();
                if (name === 'org'           && typeof window.loadOrg           === 'function') window.loadOrg();
                if (name === 'catalog'       && typeof window.loadCatalog       === 'function') window.loadCatalog();
                if (name === 'clients'       && typeof window.loadClients       === 'function') window.loadClients();
                if (name === 'postes'        && typeof window.loadPostesAndAff  === 'function') window.loadPostesAndAff();
                if (name === 'paie'          && typeof window.loadPaieAndConfig === 'function') window.loadPaieAndConfig();
                if (name === 'parametres'    && typeof window.loadCatalog       === 'function') { window.loadCatalog(); if(typeof window.loadMateriel==='function') window.loadMateriel(); }
                if (name === 'contrats'      && typeof window.loadContrats      === 'function') window.loadContrats();
                if (name === 'pointage'      && typeof window.loadPointages     === 'function') window.loadPointages();
                if (name === 'presences'     && typeof window.loadPresences     === 'function') window.loadPresences();
                if (name === 'materiel'      && typeof window.loadMateriel      === 'function') window.loadMateriel();
                if (name === 'conges'        && typeof window.loadConges        === 'function') window.loadConges();
                if (name === 'disciplinaire' && typeof window.loadDisciplinaire === 'function') window.loadDisciplinaire();
                if (name === 'evaluations'   && typeof window.loadEvaluations   === 'function') window.loadEvaluations();
                if (name === 'audit'         && typeof window.loadAudit         === 'function') window.loadAudit();
                if (name === 'rapports'      && typeof window.loadRapports      === 'function') window.loadRapports();
            }, 50);
        };

        // toggleNotificationsDropdown
        window.toggleNotificationsDropdown = function() {
            const dropdown = document.getElementById('notificationsDropdown');
            if (!dropdown) return;
            const isHidden = dropdown.classList.toggle('hidden');
            if (!isHidden && typeof window.loadNotifications === 'function') window.loadNotifications();
        };

        // clearAllNotifications
        window.clearAllNotifications = function() {
            const container = document.getElementById('notificationsContainer');
            if (container) container.innerHTML = '<div class="p-4 text-center text-slate-400">Aucune notification.</div>';
            const badge = document.getElementById('notificationBadge');
            if (badge) { badge.textContent = '0'; badge.classList.add('hidden'); }
            const dropdown = document.getElementById('notificationsDropdown');
            if (dropdown) dropdown.classList.add('hidden');
        };

        // Mobile sidebar
        window.toggleMobileSidebar = function() {
            const sidebar = document.querySelector('.main-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar) return;
            sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('open');
        };
        window.closeMobileSidebar = function() {
            const sidebar = document.querySelector('.main-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar) sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('open');
        };

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('notificationsDropdown');
            const btn = e.target.closest('[onclick*="toggleNotificationsDropdown"]');
            if (dropdown && !btn && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    </script>
</head>

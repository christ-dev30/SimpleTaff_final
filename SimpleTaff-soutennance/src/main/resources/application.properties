spring.application.name=${APP_NAME:platform}

# ── Base de données ──────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:simpletaff_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:@Juniorehui15}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2a7589d9774a3f3b97b09598b9e602498}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Email SMTP ───────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:juniorehui15@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sdqbuirwkzuepksk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Serveur ──────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Upload fichiers ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:13MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:13MB}

# ── Logging ──────────────────────────────────────────────────
logging.level.org.springframework.security=WARN

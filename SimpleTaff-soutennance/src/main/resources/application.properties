spring.application.name=${APP_NAME:platform}

# ── Base de données ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:simpletaff_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:@Juniorehui15}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Flyway ───────────────────────────────────────────────────
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2a7589d9774a3f3b97b09598b9e602498}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Email SMTP (Brevo) ───────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:juniorehui15@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Serveur ──────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Upload fichiers ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:13MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:13MB}

# ── Logging ──────────────────────────────────────────────────
logging.level.org.springframework.security=WARN

# Force UTF-8 Encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ── High Concurrency Optimizations ───────────────────────────
# Tomcat Thread Pool Tuning
server.tomcat.max-threads=1000
server.tomcat.max-connections=20000
server.tomcat.accept-count=1000

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Disable Open-in-View to prevent blocking DB connections
spring.jpa.open-in-view=false

# Enable JDBC batch inserts and updates
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
